# Technology vocabulary — SPRINT 0 DELIVERABLE (§3.3).
# Target 25-40 technologies with definition, synonyms and exclusions so the LLM
# can be constrained to valid values (§4.4.2).
#
# `cpc` lists the curated CPC/IPC subset used to join patent evidence. §4.5.2
# warns this mapping is coarse and needs a curated subset per technology rather
# than a full crosswalk — that is what these lists are.
# `orange_asset` flags technologies where Orange holds a named public asset,
# used as a right-to-win prior, never as an attractiveness input.
version: "2026-08-a"
owner: "taxonomy-curator"
count_target: "25-40"
items:

  - id: private_5g
    label: Private 5G / LTE
    definition: Dedicated cellular network deployed for a single organisation or site.
    synonyms: [private cellular, private LTE, campus 5G, NPN, standalone private network]
    exclusions: [5g_ran_oran, network_slicing]
    cpc: ["H04W16/", "H04W84/04"]
    orange_asset: true

  - id: 5g_ran_oran
    label: 5G RAN and Open RAN
    definition: Public mobile radio access technology, including disaggregated and open interfaces.
    synonyms: [Open RAN, O-RAN, vRAN, 5G SA, radio access network]
    exclusions: [private_5g, network_slicing]
    cpc: ["H04W88/08", "H04B7/"]
    orange_asset: true

  - id: network_slicing
    label: Network slicing
    definition: Logically isolated end-to-end network partitions with guaranteed characteristics over shared infrastructure.
    synonyms: [5G slicing, network partitioning, guaranteed SLA slice]
    exclusions: [private_5g, sd_wan]
    cpc: ["H04L41/", "H04W28/"]
    orange_asset: true

  - id: sd_wan
    label: SD-WAN
    definition: Software-defined wide area networking with application-aware path selection.
    synonyms: [software-defined WAN, flexible SD-WAN, overlay networking]
    exclusions: [sase, network_slicing]
    cpc: ["H04L45/", "H04L12/46"]
    orange_asset: true

  - id: sase
    label: SASE and SSE
    definition: Converged network and security delivered from the cloud edge, including SWG, CASB and ZTNA.
    synonyms: [secure access service edge, SSE, ZTNA, cloud security edge]
    exclusions: [sd_wan, zero_trust_architecture]
    cpc: ["H04L63/"]
    orange_asset: true

  - id: satellite_ntn
    label: Satellite and non-terrestrial networks
    definition: LEO/GEO satellite and direct-to-device connectivity integrated with terrestrial networks.
    synonyms: [LEO, NTN, VSAT, direct-to-device, satellite IoT]
    exclusions: [private_5g]
    cpc: ["H04B7/185", "H04W84/06"]
    orange_asset: false

  - id: lpwan
    label: LPWAN (LoRaWAN, NB-IoT, LTE-M)
    definition: Low-power wide-area radio technologies for battery-operated sensors.
    synonyms: [LoRa, LoRaWAN, NB-IoT, LTE-M, Sigfox, low power wide area]
    exclusions: [private_5g, low_power_sensors]
    cpc: ["H04W52/02", "H04W4/70"]
    orange_asset: true

  - id: wifi6e_7
    label: Wi-Fi 6E / Wi-Fi 7
    definition: Latest-generation wireless LAN including 6 GHz operation and deterministic features.
    synonyms: [Wi-Fi 6, Wi-Fi 7, WLAN, 802.11be, 6 GHz]
    exclusions: [private_5g, indoor_positioning_uwb]
    cpc: ["H04W84/12"]
    orange_asset: false

  - id: edge_computing
    label: Edge computing
    definition: Compute and storage placed close to data production, on-premise or at network edge.
    synonyms: [MEC, multi-access edge, far edge, on-prem cloud, fog computing]
    exclusions: [containers_kubernetes, sovereign_cloud]
    cpc: ["H04L67/10", "G06F9/50"]
    orange_asset: true

  - id: sovereign_cloud
    label: Sovereign and trusted cloud
    definition: Cloud infrastructure operated under a defined jurisdiction with certified isolation from foreign control.
    synonyms: [SecNumCloud, trusted cloud, national cloud, EUCS, Cloud Avenue, data residency cloud]
    exclusions: [edge_computing, confidential_computing]
    cpc: ["H04L9/", "G06F21/62"]
    orange_asset: true

  - id: containers_kubernetes
    label: Containers and Kubernetes
    definition: Containerised workload packaging and orchestration.
