# Multilingual lexicon — the non-English half of the relevance gate.
#
# WHY THIS FILE EXISTS. The gate in pipeline/ingest.py is built from the
# vocabulary labels and synonyms, and every one of those is English. FR-28
# requires English AND French ingestion, and Table 36 lists anglophone bias as a
# principal risk — but the first live corpus showed the ingestion half working
# and the gate half not: French signals averaged 0.06 relevance against 0.26 for
# English, and 52% never received a signal type at all, against 8.6% for
# English. The pipeline was paying to collect French, Dutch and German text and
# then discarding it for not containing English words.
#
# A term scoring zero is dropped BEFORE the model ever sees it (stage 3), so
# this is not a precision refinement — it decides whether a whole language's
# corpus exists downstream at all.
#
# SCOPE. Terms are the ones that actually appear in news copy and tender
# subjects, not literal dictionary translations. Deliberately conservative:
# a term so generic it matches everything ("données", "Netz", "rete") is worse
# than no term, because the gate saturates at three distinct hits. Terms shorter
# than four characters are dropped by the gate regardless.
#
# `general` carries the procurement and regulatory vernacular that is not tied
# to one vocabulary id. A tender is titled "marché de services de
# télécommunications", never "network automation", so without these the national
# procurement connectors (BOAMP 8% gate pass, TenderNed) stay near zero.
#
# Every key must be a known vocabulary id — config.py fails at load time
# otherwise, on the same principle as the crosswalks (§4.5.2).
