  # ---------------- Procurement: the buying signal nobody uses (§4.3.3) ----------------
  - id: ted
    label: TED (Tenders Electronic Daily)
    category: procurement
    connector: ted
    enabled: true
    default_tier: 1
    terms_checked: "open licence (EU) — confirm reuse notice in Sprint 0"
    cadence_days: 3
    params:
      endpoint: "https://api.ted.europa.eu/v3/notices/search"
      since_days: 90
      # TED accepts no sort parameter and returns publication-date ASCENDING,
      # so a single broad query returns only the oldest day in the window.
      # The window is sliced instead; each slice contributes its own notices,
      # which is what makes the procurement volume series honest (§4.6 momentum).
      window_slice_days: 30
      limit_per_slice: 25
      #
      # PRECISION, NOT VOLUME. The hand-written groups below are CPV ROOTS:
      # 72000000 (IT services) alone matched 785,215 notices in one 90-day
      # window, of which 415 were sampled. Sampling a fraction of a percent of a
      # set that broad is not coverage — TED became 52% of the corpus while
      # passing only 33% of the relevance gate and attaching to a topic 8% of
      # the time. The instinct is to raise the cap; that buys more of the least
      # useful signal in the system.
      #
      # `cpv_from_taxonomy` instead builds one group per use case from the `cpv`
      # hints the vocabulary already carries. The result sets are narrow enough
      # for a 25-notice sample to represent honestly, and the group label
      # becomes a use-case id, which is worth more downstream than "IT services".
      # Request budget is deliberately held flat: 30 groups x 3 slices against
      # the previous 14 x 7.
      cpv_from_taxonomy:
        # Codes are zero-padded to the eight digits TED's query parser requires
        # (see _normalise_cpv); this floor only excludes hints too broad to be
        # worth a group of their own.
        min_code_digits: 8
        max_groups: 30
      # Small disclosed contracts are procurement records, not market signals.
      # Deliberately asymmetric — see TedConnector._below_value_floor: a notice
      # that discloses NO value is never dropped, because roughly a third of TED
      # discloses none and the large framework agreements disclose least often.
      min_value_eur: 50000
      cpv_groups:
        - {label: "IT services", cpv: ["72000000"]}
        - {label: "Network and telecom", cpv: ["32400000", "64200000"]}
        - {label: "Security services and systems", cpv: ["79710000", "35120000"]}
        - {label: "Software", cpv: ["48000000"]}
        - {label: "Health IT", cpv: ["48814000", "33100000"]}
        - {label: "Environmental monitoring", cpv: ["90730000"]}
        # Added to widen vertical coverage — the first runs concentrated topics
        # in manufacturing and public sector because the CPV set did.
        - {label: "Transport and fleet", cpv: ["34970000", "63712000", "60000000"]}
        - {label: "Energy and utilities", cpv: ["09300000", "71314000"]}
        - {label: "Industrial machinery and sensors", cpv: ["42000000", "38000000"]}
        - {label: "Facilities and building systems", cpv: ["45314000", "32562000"]}
        - {label: "Financial and insurance services", cpv: ["66000000"]}
        - {label: "Education and training", cpv: ["80500000"]}
        - {label: "Emergency and public safety", cpv: ["75250000", "35700000"]}
        - {label: "Document and process services", cpv: ["79999100", "72312000"]}

  - id: boamp
    label: BOAMP (French public procurement)
    category: procurement
    connector: boamp
    enabled: true
    default_tier: 1
    terms_checked: "Licence Ouverte / Open Licence (data.gouv.fr) — confirm in Sprint 0"
    cadence_days: 7
    params:
      endpoint: "https://boamp-datadila.opendatasoft.com/api/explore/v2.1/catalog/datasets/boamp/records"
      limit_per_query: 40
      # BOAMP does not expose CPV reliably, so the join is by free-text subject
      # against the use-case vocabulary rather than through the CPV crosswalk.
      search_terms:
        - "cybersécurité"
        - "infogérance"
        - "réseau informatique"
        - "hébergement données"
        - "intelligence artificielle"
        - "télécommunications"
        - "vidéoprotection"
        - "supervision industrielle"
        - "téléphonie"
        - "maintenance prédictive"
        - "plateforme données"
        - "objets connectés"
        - "sécurité des systèmes d'information"
    note: >-
      Extends procurement coverage below the EU threshold (§4.3.3) and adds
      French-language buying signals (FR-28). Its yield was the worst of any
      source in the first corpus — 289 collected, 23 past the relevance gate,
      10 attached to a topic — not because the connector was wrong but because
      every subject line is French and the gate was English. That is fixed in
      config/taxonomy/lexicon.yaml rather than here.

  - id: find_a_tender
    label: UK Find a Tender Service (above threshold)
    category: procurement
    connector: ocds_releases
    enabled: true
    default_tier: 1
    terms_checked: "Open Government Licence v3.0 — confirm attribution wording in Sprint 0"
    cadence_days: 3
    params:
      endpoint: "https://www.find-tender.service.gov.uk/api/1.0/ocdsReleasePackages"
      notice_url_template: "https://www.find-tender.service.gov.uk/Notice/{ocid}"
      publisher: "find-tender.service.gov.uk"
      geographies: [GB]
      limit_per_page: 100
      max_pages: 10
      # OCDS release packages carry CPV under items[].additionalClassifications,
      # so these join the SAME crosswalk as TED (LK-02). The API takes no
      # keyword parameter, so subject filtering happens client-side against
      # these prefixes and what is dropped is logged.
      cpv_prefixes:
        - "48"    # software
        - "72"    # IT services
        - "32"    # radio, telecoms and broadcasting equipment
        - "64"    # postal and telecommunications services
        - "35"    # security, defence and emergency equipment
        - "38"    # laboratory, optical and precision instruments
        - "50"    # repair and maintenance
        - "71"    # architectural, engineering and inspection services
        - "79"    # business and management services
        - "80"    # education and training
        - "90"    # environmental services
    note: >-
      Contracts Finder — already wired — publishes only BELOW-threshold UK
      notices, so the entire above-threshold UK market was invisible: 63
      Contracts Finder signals stood in for a whole jurisdiction. Find a Tender
      is the post-Brexit replacement for TED in the UK and publishes OCDS.

  - id: tenderned
    label: TenderNed (Dutch public procurement)
    category: procurement
    connector: tenderned
    enabled: true
    default_tier: 1
    terms_checked: pending
    cadence_days: 7
    params:
      endpoint: "https://www.tenderned.nl/papi/tenderned-rs-tns/v2/publicaties"
      geographies: [NL]
      page_size: 100
      max_pages: 12
      # The API's own keyword parameters do not filter (both `trefwoord` and
      # `zoekwoorden` return the full 145,067-record set), so the subject filter
      # runs here against the Dutch lexicon.
      subject_terms:
        - cyberbeveiliging
        - informatiebeveiliging
        - netwerk
        - telecommunicatie
        - datacenter
        - cloud
        - kunstmatige intelligentie
        - digitalisering
        - sensoren
        - camerabewaking
        - werkplek
        - dataplatform
        - applicatiebeheer
        - telefonie
    note: >-
      §4.3.3 asks for national equivalents below the EU threshold; BOAMP proved
      the pattern for France and this is the Dutch one. It also corrects a
      geography skew the first corpus created by accident — Poland led at 802
      signals purely because TED's CPV roots matched Polish notices.

  # ---------------- Technology maturity (§4.3.5) ----------------
  - id: openalex
    label: OpenAlex
    category: technology
    connector: openalex
    enabled: true
    default_tier: 1
    terms_checked: "CC0 — open"
    cadence_days: 7
    params:
      endpoint: "https://api.openalex.org/works"
      per_page: 25
      since_days: 365
      # Highest attach rate of any source in the first corpus (86%) against six
      # hand-written queries. The limit on what it contributed was the query
      # list, not the source.
      queries_from_taxonomy:
        vocabularies: [technologies, use_cases]
        template: '{term}'
        max_queries: 24
      queries:
        - "private 5G industrial network"
        - "federated learning industrial"
        - "post-quantum cryptography migration"
        - "computer vision defect detection manufacturing"
        - "digital product passport traceability"
        - "remote patient monitoring connectivity"
        - "network slicing quality of service enterprise"
        - "industrial anomaly detection time series"
        - "digital twin manufacturing process"
        - "edge AI inference latency"
        - "supply chain traceability blockchain"
        - "worker safety sensing industrial"

  - id: arxiv
    label: arXiv
    category: technology
    connector: arxiv
    enabled: true
    default_tier: 3
    terms_checked: "arXiv API terms — attribution required"
    cadence_days: 7
    params:
      endpoint: "http://export.arxiv.org/api/query"
      max_results: 20
      # arXiv wants its own field syntax, which is exactly why the template
      # lives in config rather than in the connector.
      queries_from_taxonomy:
        vocabularies: [technologies]
        template: 'all:"{term}"'
        max_queries: 16
      queries:
        - "all:\"network slicing\" AND all:industrial"
        - "all:\"post-quantum\" AND all:migration"
        - "all:\"anomaly detection\" AND all:\"industrial control\""
        - "all:\"digital twin\" AND all:manufacturing"
        - "all:\"federated learning\" AND all:privacy"
        - "all:\"edge computing\" AND all:latency"

  - id: cordis
    label: CORDIS
    category: technology
    connector: cordis
    enabled: true
    default_tier: 1
    terms_checked: "CC-BY — open"
    cadence_days: 30
    params:
      endpoint: "https://cordis.europa.eu/api/search/results"
      num: 25
      since_days: 900
      queries_from_taxonomy:
        vocabularies: [technologies]
        template: '{term}'
        max_queries: 16
      queries:
        - "private 5G industrial"
        - "post-quantum cryptography"
        - "digital product passport"
        - "cybersecurity critical infrastructure"
        - "edge computing manufacturing"
        - "trustworthy artificial intelligence"
        - "network slicing 6G"
        - "predictive maintenance industry"
        - "health data interoperability"
        - "smart energy grid digitalisation"
        - "autonomous logistics transport"
    note: >-
      Shows what Europe has decided to fund, often with Orange or its partners
      as participants (Table 20). The search API is used rather than the 139 MB
      bulk download, which suits a per-refresh cadence far better. A long window
      is deliberate: funded projects are a multi-year leading indicator.

  - id: patents
    label: Patent databases (EPO OPS / PatentsView / Google Patents)
    category: technology
    connector: patents
    enabled: false
    default_tier: 1
    terms_checked: pending
    cadence_days: 30
    params: {}
    note: >-
      §2.5: Orange's own patent activity is a leading indicator and a stronger
      right-to-win statement than a CRM overlap count. It is also the ONLY input
      to the `technology_ownership` weight (0.08), which therefore scores zero
      for every topic today. The technology vocabulary already carries the CPC
      subsets the join needs, so the mapping is designed and waiting; what is
      missing is EPO OPS registration or BigQuery credentials, which is a
      procurement action rather than an engineering one.

  - id: ietf_datatracker
    label: IETF Datatracker (drafts and RFCs)
    category: technology
    connector: ietf_datatracker
    enabled: true
    default_tier: 1
    terms_checked: "IETF Trust — open, BCP 78/79"
    cadence_days: 14
    params:
      endpoint: "https://datatracker.ietf.org/api/v1/doc/document/"
      since_days: 540
      limit_per_query: 25
      doc_types: [draft]
      queries_from_taxonomy:
        vocabularies: [technologies]
        template: '{term}'
        max_queries: 14
      queries:
        - "post-quantum"
        - "network slicing"
        - "zero trust"
        - "certificate automation"
        - "constrained device"
    note: >-
      Table 20 calls standards bodies "the most reliable way to date when a
      network technology becomes deployable", and `standards_bodies` below tried
      to reach five of them through an empty RSS list. IETF is the one with a
      real machine-readable route — the Datatracker exposes an open REST API
      over every draft and RFC, with dates — so a draft reaching RFC becomes a
      dated horizon anchor (§4.8) rather than a press release about one.

  - id: standards_bodies
    label: 3GPP, ETSI, O-RAN, GSMA
    category: technology
    connector: rss_feed
    enabled: false
    default_tier: 1
    terms_checked: pending
    cadence_days: 30
    params: {feeds: []}
    note: >-
      Still dark, and now for a stated reason rather than an empty list: none of
      these bodies publishes a feed. Probed 2026-08-20, 3GPP (`/feed`) and ETSI
      (`?format=feed&type=rss`) both return HTML to a feed request. Reaching
      them means parsing the 3GPP work plan (published as structured
      spreadsheets) and the ETSI work programme, which is a scraper with terms
      to clear, not a connector. IETF, the member of this group that does have
      an API, has been split out above and is live.

  # ---------------- Demand-side leading indicators ----------------
  # Two sources that precede a tender rather than report it. §4.3.3 credits
  # procurement with removing the lead-time problem; these push the lead time
  # further back still.

  - id: sec_edgar
    label: SEC EDGAR full-text search
    category: signals
    connector: sec_edgar
    enabled: true
    default_tier: 1
    terms_checked: "US federal government work — public domain; SEC asks for a contact User-Agent"
    cadence_days: 7
    params:
      endpoint: "https://efts.sec.gov/LATEST/search-index"
      forms: "8-K,10-K,10-Q"
      since_days: 180
      max_hits_per_query: 15
      geographies: [US]
      queries_from_taxonomy:
        vocabularies: [technologies]
        template: '{term}'
        max_queries: 16
      queries:
        - "private 5G"
        - "post-quantum"
        - "operational technology security"
        - "digital product passport"
        - "sovereign cloud"
    note: >-
      Named enterprises describing their own deployments in filings they are
      legally obliged to make accurate. The first corpus carried 309
      `market_move` signals out of 7,275, nearly all vendor announcements
      relayed by a news outlet — the party with the least incentive to be
      conservative. A filing is the buyer's own account, dated and attributable,
      and the most quotable evidence a salesperson can take into a meeting
      (FR-18).

  - id: adzuna_jobs
    label: Adzuna job postings
    category: signals
    connector: adzuna_jobs
    enabled: false
    default_tier: 3
    terms_checked: "Adzuna API terms — free tier requires attribution; confirm in Sprint 0"
    cadence_days: 7
    params:
      endpoint: "https://api.adzuna.com/v1/api/jobs"
      countries: [gb, fr, de, nl, es]
      results_per_page: 20
      queries_from_taxonomy:
        vocabularies: [technologies]
        template: '{term}'
        max_queries: 12
      queries:
        - "OT security engineer"
        - "private 5G engineer"
        - "post-quantum cryptography"
        - "SOC analyst"
    note: >-
      An enterprise hiring an OT security engineer or a private-5G RF planner
      has committed budget months before a tender exists. Postings are dated,
      employer-named and geo-tagged — everything the signal schema wants — and
      almost nobody uses them for radar work. DISABLED pending ADZUNA_APP_ID and
      ADZUNA_APP_KEY: the connector is implemented and will run the moment the
      credentials exist. Tier 3 on purpose — a posting is recruiter copy, prone
      to the same buzzword inflation that puts Hacker News at tier 3 (Table 17).

  - id: github_repos
    label: GitHub repository activity
    category: technology
    connector: github_repos
    enabled: false
    default_tier: 3
    terms_checked: "GitHub REST API terms of service"
    cadence_days: 14
    params:
      endpoint: "https://api.github.com/search/repositories"
      per_page: 20
      min_stars: 10
      since_days: 180
      queries_from_taxonomy:
        vocabularies: [technologies]
        template: '{term}'
        max_queries: 12
    note: >-
      arXiv and OpenAlex measure what is being RESEARCHED; repository activity
      measures what is being BUILT, which is a later point on the same maturity
      curve. DISABLED pending GITHUB_TOKEN: unauthenticated search returned HTTP
      403 on the first request from a clean IP (probed 2026-08-20), so enabling
      it without a token would add a source that silently contributes nothing —
      precisely the failure `ncsc_uk` demonstrated.

