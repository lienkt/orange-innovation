  - id: ncsc_uk
    label: UK NCSC
    category: regulation
    connector: rss_feed
    enabled: true
    default_tier: 1
    terms_checked: pending
    cadence_days: 7
    # §2.6: urgency is jurisdiction-specific, and the corpus had no UK signal.
    params:
      feeds:
        - "https://www.ncsc.gov.uk/api/1/services/v1/report-rss-feed.xml"

  - id: uk_contracts
    label: UK Contracts Finder
    category: procurement
    connector: uk_contracts
    enabled: true
    default_tier: 1
    terms_checked: "Open Government Licence v3.0 — confirm attribution wording in Sprint 0"
    cadence_days: 7
    params:
      endpoint: "https://www.contractsfinder.service.gov.uk/Published/Notices/OCDS/Search"
      limit_per_query: 50
      # Releases carry CPV, so UK tenders join the same crosswalk as TED.
      keywords:
