        - "all:\"post-quantum\" AND all:migration"
        - "all:\"anomaly detection\" AND all:\"industrial control\""
        - "all:\"digital twin\" AND all:manufacturing"
        - "all:\"federated learning\" AND all:privacy"
        - "all:\"edge computing\" AND all:latency"

  - id: cordis
    label: CORDIS
    category: technology
    connector: cordis
    enabled: true
    default_tier: 1
    terms_checked: "CC-BY — open"
    cadence_days: 30
    params:
      endpoint: "https://cordis.europa.eu/api/search/results"
      num: 25
      since_days: 900
      queries:
        - "private 5G industrial"
        - "post-quantum cryptography"
        - "digital product passport"
        - "cybersecurity critical infrastructure"
        - "edge computing manufacturing"
        - "trustworthy artificial intelligence"
        - "network slicing 6G"
        - "predictive maintenance industry"
        - "health data interoperability"
        - "smart energy grid digitalisation"
        - "autonomous logistics transport"
    note: >-
      Shows what Europe has decided to fund, often with Orange or its partners
      as participants (Table 20). The search API is used rather than the 139 MB
      bulk download, which suits a per-refresh cadence far better. A long window
      is deliberate: funded projects are a multi-year leading indicator.

  - id: patents
    label: Patent databases (EPO OPS / PatentsView / Google Patents)
    category: technology
    connector: patents
    enabled: false
    default_tier: 1
    terms_checked: pending
    cadence_days: 30
    params: {}
    note: >-
      §2.5: Orange's own patent activity is a leading indicator and a stronger
      right-to-win statement than a CRM overlap count. Needs EPO OPS registration
      or BigQuery credentials — deferred to the internal-catalogue cadence.

  - id: standards_bodies
    label: 3GPP, ETSI, O-RAN, IETF, GSMA
    category: technology
    connector: rss_feed
    enabled: false
    default_tier: 1
    terms_checked: pending
    cadence_days: 30
    params: {feeds: []}
    note: "The most reliable way to date when a network technology becomes deployable (Table 20)."

