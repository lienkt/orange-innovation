# Source catalogue (Appendix A / Table 37).
# `connector` names a class registered in radar.connectors.REGISTRY.
# `default_tier` is the connector's declared tier; publisher_overrides in
# config/source_tiers.yaml take precedence per item.
# `enabled: false` sources are catalogued but not wired at MVP — the catalogue
# is the requirements record, not only the runtime config.
#
# NFR-07 / DR-08: every enabled source must have `terms_checked` set before it
# runs in anything other than a prototype. `terms_checked: pending` is a Sprint 0
# action, not an assertion that the terms permit use.
version: "2026-08-a"

sources:

  # ---------------- Signals: what the world is talking about (§4.3.1) ----------------
  - id: gdelt
    label: GDELT Project
    category: signals
    connector: gdelt
    enabled: true
    default_tier: 2
    terms_checked: pending
    cadence_days: 1
    # GDELT rate-limits aggressively (HTTP 429). One request per 6s keeps a
    # multi-query refresh inside its budget without triggering backoff.
    rate_limit_seconds: 6
    params:
      # Queries are built from the taxonomy grid at runtime; these are the seed
      # themes for the first tranche.
      max_records: 60
      timespan: "14d"
      queries:
        - '"private 5G" AND (manufacturing OR factory OR industrial)'
        - '"OT security" OR "industrial cybersecurity"'
        - '"digital product passport" AND (traceability OR ecodesign)'
        - '"sovereign cloud" AND (europe OR france OR "data residency")'
        - '"agentic AI" AND (enterprise OR "contact center" OR insurance)'
        - '"post-quantum" AND (migration OR cryptography OR enterprise)'
        - '"NIS2" OR "DORA" AND compliance'
        - '"remote patient monitoring" OR "connected health"'
        - '"counter-drone" OR "drone detection" AND airport OR site'
        - '"predictive maintenance" AND (energy OR utilities OR rail)'
        - '"network slicing" AND enterprise'
        - '"worker safety" AND (wearable OR sensor) AND industrial'
        - '"warehouse automation" OR "autonomous mobile robots"'
        - '"clinical data" AND (interoperability OR "health data space")'
        - '"zero trust" AND (enterprise OR deployment)' 

  - id: google_news
