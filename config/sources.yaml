    category: signals
    connector: rss_search
    enabled: true
    default_tier: 2
    terms_checked: pending
    cadence_days: 1
    params:
      endpoint: "https://news.google.com/rss/search"
      hl: "en-GB"
      gl: "GB"
      ceid: "GB:en"
      queries:
        - "private 5G manufacturing deployment"
        - "NIS2 compliance deadline enterprise"
        - "digital product passport regulation"
        - "sovereign cloud SecNumCloud enterprise"
        - "agentic AI contact center deployment"
        - "post-quantum cryptography migration enterprise"
        - "OT security critical infrastructure directive"
        - "drone detection airport security"
        - "SD-WAN branch network modernisation"
        - "network slicing enterprise service"
        - "satellite connectivity remote sites enterprise"
        - "predictive maintenance rail utilities"
        - "worker safety wearables industrial"
        - "warehouse automation robotics logistics"
        - "claims automation insurance AI"
        - "digital workplace collaboration sovereign"
        - "identity access management zero trust"
        - "emissions monitoring industrial compliance"
        - "clinical data interoperability EHDS"
        - "citizen services digital government platform"

  - id: google_news_fr
    label: Google News RSS (French)
    category: signals
    connector: rss_search
    enabled: true
    default_tier: 2
    terms_checked: pending
    cadence_days: 1
    # FR-28 requires English AND French source ingestion, and Table 36 lists
    # "anglophone and EU bias in sources" as a principal risk whose mitigation
    # is multilingual ingestion plus explicit language-coverage monitoring.
    # Without this feed the first live run was 100% English across 468 signals,
    # which fails FR-28 outright and makes the NFR-08 coverage metric report a
    # blind spot rather than a balance.
    params:
      endpoint: "https://news.google.com/rss/search"
      hl: "fr-FR"
      gl: "FR"
      ceid: "FR:fr"
      queries:
        - "5G privé industrie déploiement"
        - "cybersécurité NIS2 conformité entreprise"
        - "cloud souverain SecNumCloud entreprise"
        - "passeport numérique produit réglementation"
        - "intelligence artificielle agents entreprise"
        - "détection drones aéroport sécurité"
        - "cryptographie post-quantique migration"
        - "télésurveillance médicale patients"
        - "réseau SD-WAN entreprise modernisation"
        - "maintenance prédictive industrie"
        - "sécurité OT systèmes industriels"
        - "interopérabilité données de santé"
        - "services publics numériques citoyens"
        - "traçabilité chaîne approvisionnement"

  - id: bing_news
    label: Bing News RSS
    category: signals
    connector: rss_search
    enabled: true
    default_tier: 2
    terms_checked: pending
    cadence_days: 1
    # A second news engine is not redundancy: SC-03 measures diversity across
    # PUBLISHERS, and Bing surfaces materially different outlets from Google.
    params:
      endpoint: "https://www.bing.com/news/search"
      query_param: "q"
      extra_params: {format: "RSS"}
      queries:
        - "private 5G enterprise deployment"
        - "OT security manufacturing"
        - "sovereign cloud europe enterprise"
        - "post-quantum migration enterprise"
        - "digital product passport compliance"
        - "agentic AI contact centre"
        - "drone detection critical infrastructure"
        - "remote patient monitoring connectivity"
        - "SD-WAN network modernisation"
        - "NIS2 DORA compliance deadline"

  - id: trade_press
    label: Independent trade press (Light Reading, The Register)
    category: signals
    connector: rss_feed
    enabled: true
    default_tier: 2
    terms_checked: pending
    cadence_days: 1
    # §4.3.7 tier 2 — "established trade and general press with editorial
    # independence". The corpus was overwhelmingly tier 1 (official) and tier 4
    # was absent entirely, which left evidence quality untested against the
    # middle of the scale and diversity thinner than it looked.
    params:
      feeds:
        - "https://www.lightreading.com/rss.xml"
        - "https://www.theregister.com/headlines.atom"

  - id: cert_eu
    label: CERT-EU security advisories
    category: regulation
    connector: rss_feed
    enabled: true
    default_tier: 1
    terms_checked: pending
    cadence_days: 3
    params:
