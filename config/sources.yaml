    # THIS SOURCE WAS SILENTLY RETURNING NOTHING. It was enabled and had never
    # produced a single raw item — not a low yield, a zero. The feed was not
    # broken: `report-rss-feed.xml` is a low-frequency publication feed whose
    # newest entry was dated May 2025, so every item fell outside the refresh
