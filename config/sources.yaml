  - id: crossref
    label: Crossref
    category: technology
    connector: crossref
    enabled: true
    default_tier: 1
    terms_checked: "Crossref REST API — open, polite pool with mailto"
    cadence_days: 7
    params:
      endpoint: "https://api.crossref.org/works"
      rows: 25
      since_days: 540
      mailto: "stephane@stepvda.com"
      queries:
        - "private 5G industrial network"
        - "post-quantum cryptography migration"
        - "digital product passport traceability"
        - "industrial control system security"
        - "edge computing latency manufacturing"
        - "federated learning industry"
        - "remote patient monitoring"
        - "network slicing enterprise"

  - id: hacker_news
    label: Hacker News
    category: signals
    connector: hackernews
    enabled: true
    default_tier: 3
    terms_checked: "Algolia HN Search API — free, no key"
    cadence_days: 1
    params:
      endpoint: "https://hn.algolia.com/api/v1/search_by_date"
      hits_per_page: 25
      # A submission nobody upvoted is not attention.
      min_points: 3
      queries:
        - "private 5G"
        - "post-quantum cryptography"
        - "edge inference"
        - "industrial IoT security"
        - "digital product passport"
        - "sovereign cloud"
        - "agentic AI enterprise"
        - "OT security"
    note: "Practitioner attention, months ahead of analyst coverage; noisy and heavily anglophone (Table 17), hence tier 3."

  # ---------------- Regulation: the most reliable urgency signal (§4.3.2) ----------------
  - id: eurlex
    label: EUR-Lex (CELLAR SPARQL)
    category: regulation
    connector: eurlex
    enabled: true
    default_tier: 1
    terms_checked: pending
    cadence_days: 7
    params:
      endpoint: "https://publications.europa.eu/webapi/rdf/sparql"
      since_days: 400
      # CELLAR returns one row per expression title, and several titles share a
      # work, so rows collapse heavily on URL dedup: 120 rows yielded only 20
      # distinct legal acts in the first live run. The limit is raised to
      # compensate; a EuroVoc-concept query would be the proper Sprint 0 fix.
      limit: 600
      # EuroVoc-adjacent free-text filters over English titles.
      title_filters:
        - "cyber"
        - "artificial intelligence"
        - "data"
        - "ecodesign"
        - "digital"
        - "network and information"
        - "resilience"
        - "health data"

  - id: enisa
    label: ENISA publications
    category: regulation
    connector: rss_feed
    enabled: false
    default_tier: 1
    terms_checked: pending
    cadence_days: 7
    params:
      feeds: []
    note: >-
      Strong for cybersecurity opportunity spaces (Table 18), but ENISA retired
      its public RSS endpoints — every documented feed path returns 404 as of
      2026-08-17. Sprint 0 action: confirm the current machine-readable access
      route (their publications API or a scrape under agreed terms) before
      enabling. Left catalogued rather than deleted because the source is
      required by the requirements baseline.

  - id: eu_have_your_say
    label: EC "Have your say"
    category: regulation
    connector: have_your_say
    enabled: true
    default_tier: 1
    terms_checked: "europa.eu reuse policy — open with attribution"
    cadence_days: 7
    params:
      endpoint: "https://ec.europa.eu/info/law/better-regulation/brpapi/searchInitiatives"
      size: 60
      pages: 3
      since_days: 400
    note: >-
      The earliest formal indicator of a coming rule (Table 18). Items are
      tagged instrument_stage=consultation, which is what lets the horizon logic
      place a topic in Later on policy grounds rather than by guesswork (§4.8).

  - id: national_regulators
    label: National regulators (ANSSI / CERT-FR)
    category: regulation
    connector: rss_feed
    enabled: true
    default_tier: 1
    terms_checked: pending
    cadence_days: 7
    params:
      feeds:
        - "https://www.cert.ssi.gouv.fr/feed/"
    note: >-
      Urgency is jurisdiction-specific (§2.6), so national regulators matter
      independently of EU-level instruments. Only CERT-FR (ANSSI) is wired:
      Ofcom returns 403 to automated clients, and the documented BNetzA and BIPT
      feed paths 404 as of 2026-08-17. Those three remain to be sourced in
      Sprint 0. CERT-FR also contributes French-language signal, which FR-28
      requires.

  - id: nist
    label: NIST standards timelines
    category: regulation
    connector: rss_feed
    enabled: true
    default_tier: 1
    terms_checked: pending
    cadence_days: 14
    params:
      feeds:
        - "https://www.nist.gov/news-events/news/rss.xml"
    note: "Directly supports quantum-safe topics where Orange already has an offer (Table 18)."

  # ---------------- Procurement: the buying signal nobody uses (§4.3.3) ----------------
  - id: ted
    label: TED (Tenders Electronic Daily)
    category: procurement
    connector: ted
    enabled: true
    default_tier: 1
    terms_checked: "open licence (EU) — confirm reuse notice in Sprint 0"
    cadence_days: 3
    params:
      endpoint: "https://api.ted.europa.eu/v3/notices/search"
      since_days: 90
      # TED accepts no sort parameter and returns publication-date ASCENDING,
      # so a single broad query returns only the oldest day in the window.
      # The window is sliced instead; each slice contributes its own notices,
      # which is what makes the procurement volume series honest (§4.6 momentum).
      window_slice_days: 14
      limit_per_slice: 20
      # CPV roots drawn from the use-case vocabulary's `cpv` hints.
      cpv_groups:
        - {label: "IT services", cpv: ["72000000"]}
        - {label: "Network and telecom", cpv: ["32400000", "64200000"]}
        - {label: "Security services and systems", cpv: ["79710000", "35120000"]}
        - {label: "Software", cpv: ["48000000"]}
        - {label: "Health IT", cpv: ["48814000", "33100000"]}
        - {label: "Environmental monitoring", cpv: ["90730000"]}
        # Added to widen vertical coverage — the first runs concentrated topics
        # in manufacturing and public sector because the CPV set did.
        - {label: "Transport and fleet", cpv: ["34970000", "63712000", "60000000"]}
        - {label: "Energy and utilities", cpv: ["09300000", "71314000"]}
        - {label: "Industrial machinery and sensors", cpv: ["42000000", "38000000"]}
        - {label: "Facilities and building systems", cpv: ["45314000", "32562000"]}
        - {label: "Financial and insurance services", cpv: ["66000000"]}
        - {label: "Education and training", cpv: ["80500000"]}
        - {label: "Emergency and public safety", cpv: ["75250000", "35700000"]}
        - {label: "Document and process services", cpv: ["79999100", "72312000"]}

  - id: boamp
    label: BOAMP (French public procurement)
    category: procurement
    connector: boamp
    enabled: true
    default_tier: 1
    terms_checked: "Licence Ouverte / Open Licence (data.gouv.fr) — confirm in Sprint 0"
    cadence_days: 7
    params:
      endpoint: "https://boamp-datadila.opendatasoft.com/api/explore/v2.1/catalog/datasets/boamp/records"
      limit_per_query: 40
      # BOAMP does not expose CPV reliably, so the join is by free-text subject
      # against the use-case vocabulary rather than through the CPV crosswalk.
      search_terms:
        - "cybersécurité"
        - "infogérance"
        - "réseau informatique"
        - "hébergement données"
        - "intelligence artificielle"
        - "télécommunications"
        - "vidéoprotection"
        - "supervision industrielle"
        - "téléphonie"
        - "maintenance prédictive"
        - "plateforme données"
        - "objets connectés"
        - "sécurité des systèmes d'information"
    note: "Extends procurement coverage below the EU threshold (§4.3.3) and adds French-language buying signals (FR-28)."

