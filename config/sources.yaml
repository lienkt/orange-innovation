  - id: google_news_fr
    label: Google News RSS (French)
    category: signals
    connector: rss_search
    enabled: true
    default_tier: 2
    terms_checked: pending
    cadence_days: 1
    # FR-28 requires English AND French source ingestion, and Table 36 lists
    # "anglophone and EU bias in sources" as a principal risk whose mitigation
    # is multilingual ingestion plus explicit language-coverage monitoring.
    # Without this feed the first live run was 100% English across 468 signals,
    # which fails FR-28 outright and makes the NFR-08 coverage metric report a
    # blind spot rather than a balance.
    params:
      endpoint: "https://news.google.com/rss/search"
      hl: "fr-FR"
      gl: "FR"
      ceid: "FR:fr"
      geographies: [FR]
      # Drawn from the French half of config/taxonomy/lexicon.yaml, which is
      # also what now lets these signals survive the relevance gate at all.
      queries_from_taxonomy:
        vocabularies: [use_cases, technologies]
        language: fr
        template: '{term} entreprise'
        max_queries: 24
      queries:
        - "5G privé industrie déploiement"
        - "cybersécurité NIS2 conformité entreprise"
        - "cloud souverain SecNumCloud entreprise"
        - "passeport numérique produit réglementation"
        - "intelligence artificielle agents entreprise"
        - "détection drones aéroport sécurité"
        - "cryptographie post-quantique migration"
        - "télésurveillance médicale patients"
        - "réseau SD-WAN entreprise modernisation"
        - "maintenance prédictive industrie"
        - "sécurité OT systèmes industriels"
        - "interopérabilité données de santé"
        - "services publics numériques citoyens"
        - "traçabilité chaîne approvisionnement"

  - id: bing_news
    label: Bing News RSS
    category: signals
    connector: rss_search
    enabled: true
    default_tier: 2
    terms_checked: pending
    cadence_days: 1
    # A second news engine is not redundancy: SC-03 measures diversity across
    # PUBLISHERS, and Bing surfaces materially different outlets from Google.
    params:
      endpoint: "https://www.bing.com/news/search"
      query_param: "q"
      extra_params: {format: "RSS", mkt: "en-GB"}
      # Every link arrives as a bing.com/news/apiclick.aspx redirect. Stored
      # raw, all 76 items booked ONE publisher — for the source added precisely
      # because SC-03 measures diversity across publishers — and the stored URL
      # was a redirect where NFR-02 wants a citable source. The destination is
      # already in the query string, so unwrapping costs no extra request.
      unwrap_redirects: true
      queries_from_taxonomy:
        vocabularies: [technologies]
        template: '{term} enterprise'
        max_queries: 16
      queries:
        - "private 5G enterprise deployment"
        - "OT security manufacturing"
        - "sovereign cloud europe enterprise"
        - "post-quantum migration enterprise"
        - "digital product passport compliance"
        - "agentic AI contact centre"
        - "drone detection critical infrastructure"
        - "remote patient monitoring connectivity"
        - "SD-WAN network modernisation"
        - "NIS2 DORA compliance deadline"

