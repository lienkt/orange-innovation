# Source catalogue (Appendix A / Table 37).
# `connector` names a class registered in radar.connectors.REGISTRY.
# `default_tier` is the connector's declared tier; publisher_overrides in
# config/source_tiers.yaml take precedence per item.
# `enabled: false` sources are catalogued but not wired at MVP — the catalogue
# is the requirements record, not only the runtime config.
#
# NFR-07 / DR-08: every enabled source must have `terms_checked` set before it
# runs in anything other than a prototype. `terms_checked: pending` is a Sprint 0
# action, not an assertion that the terms permit use.
version: "2026-08-b"

sources:

  # ---------------- Signals: what the world is talking about (§4.3.1) ----------------
  - id: gdelt
    label: GDELT Project
    category: signals
    connector: gdelt
    enabled: true
    default_tier: 2
    terms_checked: pending
    cadence_days: 1
    # GDELT rate-limits aggressively and applies a LONG per-IP cooldown once it
    # starts answering 429. Its request budget is queries x slices, and the
    # first run at 27 queries x 7 slices (189 requests) tripped the circuit
    # breaker and returned nothing at all — worse than the 281 items the old
    # unsliced config produced.
    #
    # THE TRADE-OFF IS EXPLICIT. GDELT cannot afford both breadth and depth
    # here. Depth wins: §4.6 momentum is the slope over six trailing periods and
    # an unsliced GDELT has a 14-day memory, which makes its slope an artefact
    # of the result-set length rather than a measurement. So the window is
    # sliced coarsely (3 x 30 days) and the query list is cut to match —
    # 20 queries x 3 slices = 60 requests, roughly a third of what failed.
    #
    # GDELT is worth this care: it is the only source with real publisher
    # diversity per signal (153 distinct publishers from 281 items) and the only
    # geo-tagged news in the corpus.
    rate_limit_seconds: 8
    params:
      max_records: 60
      window_slice_days: 30
      geographies: []
      # NFR-11: the vocabulary is the control surface. These literal seeds are
      # kept because they encode boolean qualifiers the vocabulary cannot.
      queries_from_taxonomy:
        vocabularies: [technologies]
        template: '"{term}" AND (enterprise OR industrial OR deployment)'
        max_queries: 5
      queries:
        - '"private 5G" AND (manufacturing OR factory OR industrial)'
        - '"OT security" OR "industrial cybersecurity"'
        - '"digital product passport" AND (traceability OR ecodesign)'
        - '"sovereign cloud" AND (europe OR france OR "data residency")'
        - '"agentic AI" AND (enterprise OR "contact center" OR insurance)'
        - '"post-quantum" AND (migration OR cryptography OR enterprise)'
        - '"NIS2" OR "DORA" AND compliance'
        - '"remote patient monitoring" OR "connected health"'
        - '"counter-drone" OR "drone detection" AND airport OR site'
        - '"predictive maintenance" AND (energy OR utilities OR rail)'
        - '"network slicing" AND enterprise'
        - '"worker safety" AND (wearable OR sensor) AND industrial'
        - '"warehouse automation" OR "autonomous mobile robots"'
        - '"clinical data" AND (interoperability OR "health data space")'
        - '"zero trust" AND (enterprise OR deployment)' 

