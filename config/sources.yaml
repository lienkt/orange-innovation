  # ---------------- Regulation: the most reliable urgency signal (§4.3.2) ----------------
  - id: eurlex
    label: EUR-Lex (CELLAR SPARQL)
    category: regulation
    connector: eurlex
    enabled: true
    default_tier: 1
    terms_checked: pending
    cadence_days: 7
    params:
      endpoint: "https://publications.europa.eu/webapi/rdf/sparql"
      since_days: 400
      # CELLAR returns one row per expression title, and several titles share a
      # work, so rows collapse heavily on URL dedup: 120 rows yielded only 20
      # distinct legal acts in the first live run. The limit is raised to
      # compensate; a EuroVoc-concept query would be the proper Sprint 0 fix.
      limit: 600
      # EuroVoc-adjacent free-text filters over English titles.
      title_filters:
        - "cyber"
        - "artificial intelligence"
        - "data"
        - "ecodesign"
        - "digital"
        - "network and information"
        - "resilience"
        - "health data"

