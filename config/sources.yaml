  # ---------------- Internal evidence (§2.5) ----------------

  - id: internal
    label: Internal signal intake (conversations, RFP themes, lost deals)
    category: internal
    connector: none
    enabled: false
    default_tier: 3
    terms_checked: "first-party — internal use, DR-09 applies"
    cadence_days: 1
    params: {}
    note: >-
      NOT FETCHED, which is why `enabled` is false and `connector` is none — it
      is catalogued here so tiering and coverage reporting can see it, like any
      other evidence class. Records arrive through `radar internal add`, are
      inert until `radar internal moderate` reviews them, and reach the signal
      store through `radar internal promote` (src/radar/internal.py).

      This is the largest gap in the source catalogue and the only one that
      cannot be closed by writing a connector. `internal_signals` was created by
      the schema and referenced by nothing — no writer, no reader, zero rows —
      so the one evidence class that says what Orange's own people are hearing
      contributed nothing. Tier 3 deliberately: §4.3.7 reserves tier 1 for
      published authoritative records, and a conversation is not one however
      well informed.

