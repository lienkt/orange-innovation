# ---------------------------------------------------------------------------
# Certifications. `required_by` drives compliance fit: a certification is
# REQUIRED_BY a vertical in a geography (§4.5.1).
# ---------------------------------------------------------------------------
certifications:
  - id: iso_27001
    label: ISO 27001
    required_by_verticals: [financial_services, public_sector, healthcare, defense, manufacturing, energy]
    geographies: [EU, GLOBAL]
  - id: soc2_type2
    label: SOC 2 Type II
    required_by_verticals: [financial_services, media_entertainment, wholesale]
    geographies: [GLOBAL]
  - id: secnumcloud
    label: SecNumCloud
    required_by_verticals: [public_sector, defense, healthcare, energy]
    geographies: [FR]
    sovereign: true
  - id: hds
    label: HDS (Hébergeur de Données de Santé)
    required_by_verticals: [healthcare, life_sciences]
    geographies: [FR]
    sovereign: true
  - id: tisax
    label: TISAX
    required_by_verticals: [automotive, manufacturing]
    geographies: [EU, DE]
  - id: cispe
    label: CISPE
    required_by_verticals: [public_sector, financial_services]
    geographies: [EU]
    sovereign: true

