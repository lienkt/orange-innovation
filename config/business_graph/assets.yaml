# ---------------------------------------------------------------------------
# Research assets (§2.5). Orange's own research and patent activity is a leading
# indicator that precedes market signals by years, and a far stronger
# right-to-win statement than a CRM overlap count (§2.5).
#
# The MVP models this at portfolio level only. Per-technology patent counts
# require the `patents` connector, which is deferred (config/sources.yaml).
# ---------------------------------------------------------------------------
research_assets:
  patents_total: 11000
  patents_note: "Largest portfolio among European telecom operators; licensed to 2,000+ companies; 192 new inventions patented in 2024."
  cooperative_research_projects: 65
  academic_industrial_partnerships: 150
  orange_fab_accelerators: 22
  startups_supported: 1000
  ventures_note: "Orange Ventures has re-aligned its investment thesis to Trust the future. ZEBOX accelerator agreement signed April 2026."
  # Technologies where the technology vocabulary records orange_asset: true are
  # treated as having a research/portfolio prior until the patent connector runs.

