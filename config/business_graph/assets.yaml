# ---------------------------------------------------------------------------
# Partners. `tier` is an EDGE property (§4.5.1) and decays — LK-07 re-validates
# these on the internal-catalogue refresh cycle because partner tiers change.
# tier_rank normalises heterogeneous vendor tier names onto a 0-1 scale so
# partner coverage is computable across vendors.
# ---------------------------------------------------------------------------
partner_tier_ranks:
  diamond: 1.00
  elite: 0.95
  premier: 0.90
  "global gold": 0.90
  platinum: 0.85
  gold: 0.80
  advanced: 0.70
  msp: 0.70
  registered: 0.40
  unspecified: 0.50

partners:
  - id: palo_alto_networks
    label: Palo Alto Networks
    tier: diamond
    tier_note: "Diamond; #1 EMEA partner"
    provides_technologies: [sase, zero_trust_architecture, siem_soar]
    domains: [cybersecurity]

  - id: microsoft
    label: Microsoft
    tier: gold
    tier_note: "Gold MAICPP; Partner of the Year"
