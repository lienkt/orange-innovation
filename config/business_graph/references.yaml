# Orange Business Graph — reference case nodes (Table 24, LK-01).
# SOURCE: published customer-story corpus as recorded in §2.7 and Table 5.
#
# TWO DISTINCT THINGS LIVE HERE:
#  1. `distribution` — the published counts per industry and per expertise area
#     (Table 5). This is the authoritative input to reference density (SC-13),
#     because the named list below is the subset the document names, not the
#     whole corpus.
#  2. `named` — the individually named references (§2.7), which are what the UI
#     shows as inspectable proof points (LK-08).
#
# §2.7: the distribution is uneven, and a radar that ignores the asymmetry will
# hand a salesperson a banking topic with no proof point behind it.
version: "2026-08-a"
owner: "business-graph-curator"
as_of: "2026-08-17"
source: "orange-business.com customer stories, August 2026, via requirements document §2.7 / Table 5"

