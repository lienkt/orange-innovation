# Competitor register (§4.3.3, Table 27 "award concentration among competitors").
#
# The same standard as the rest of the business graph (DR-11, NFR-02): every
# entry is a named entity with a stated source and an as-of date, because a
# competitor claim that reaches a customer conversation has to be defensible.
# Nothing here is generated; the model that writes the competitive narrative may
# only name entities from this file that the evidence actually supports, exactly
# as the next-action generator may only name Orange assets it was handed.
#
# `relationship` is the field that makes this list honest for Orange Business:
# the same company is frequently a partner in one motion and a competitor in
# another. Microsoft is a Gold partner and sells the customer a Teams-native
# contact centre; Cisco is a Global Gold partner and sells managed SD-WAN
# directly. Recording that as `both` is more useful to a salesperson than
# pretending either half is not true.
#
# `aliases` drive evidence matching against the signal corpus. They are matched
# on word boundaries and are deliberately conservative: an ambiguous short name
# (SES, Colt, NICE) produces false positives that would put an invented
# competitor in front of a customer, so ambiguous entries carry only their
# unambiguous forms.

# `website` is the entry point for the competitor profiler (`radar competitor-scrape`).
# `scrape` records what happened rather than hiding it: `ok` means the site was
# fetched under its own robots.txt; `blocked` means the publisher refuses
# automated clients and we do not work around that; `unreachable` means the
# fetch failed from our network. A blocked competitor keeps its curated fields
# and is shown in the interface as an explicit profiling gap, on the same
# principle as an unwired source in config/sources.yaml.

version: "competitors-2026-08-a"
owner: "innovation-radar-curator"
as_of: "2026-08-18"
source: >-
  Public market positioning, analyst coverage cited in config/business_graph/assets.yaml,
  and vendor category leadership as published by the vendors themselves. This register is a
  Sprint 0 curation deliverable and is expected to be reviewed by Orange Business
  competitive intelligence before it is used in front of a customer.

# Weight per competitor type in the intensity score. A hyperscaler or a global
# integrator entering a space changes its economics more than one more regional
# reseller does, so the types are not equal.
types:
  telco_peer:
    label: Telecom operator peer
    weight: 1.0
    note: Competes for the same managed-service budget with the same operator story.
  hyperscaler:
    label: Hyperscaler
    weight: 1.2
    note: Sets the reference price and often owns the customer's platform decision.
  global_si:
    label: Global systems integrator
    weight: 1.0
    note: Competes for the integration and transformation budget above the network.
  security_specialist:
    label: Security specialist
    weight: 0.9
  network_vendor:
    label: Network equipment vendor
    weight: 0.8
    note: Increasingly sells direct to enterprises rather than only through operators.
  industrial_specialist:
    label: Industrial / OT specialist
    weight: 0.9
    note: Owns the plant relationship, which is the hardest position to displace.
  cloud_sovereign:
    label: Sovereign cloud provider
    weight: 0.9
  data_ai_specialist:
    label: Data and AI platform
    weight: 0.8
  cx_specialist:
    label: Customer-experience platform
    weight: 0.9
  satellite_operator:
    label: Satellite operator
    weight: 0.8
  regional_integrator:
    label: Regional integrator or reseller
    weight: 0.5
    note: Numerous and price-driven; raises intensity in aggregate, not individually.

